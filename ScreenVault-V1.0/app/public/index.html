<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ScreenVault V1.0</title><style>
body{margin:0;background:#080c16;color:#eaf0ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:30px}.card{background:#121a2b;border:1px solid #273552;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{font-size:30px;font-weight:800}input,button,select{padding:10px;border-radius:8px;border:1px solid #3a4968;background:#0e1524;color:white;margin:4px}button{cursor:pointer}.tag{background:#26385f;padding:4px 8px;border-radius:20px;font-size:12px}.muted{color:#98a6c4}pre{max-height:400px;overflow:auto}
</style></head><body><main><h1>ScreenVault <span class="tag">V1.0 MVP</span></h1><p class="muted">Trust the person. Protect the production.</p>
<div id="login" class="card"><input id="email" value="actor@screenvault.local"><input id="pw" type="password" value="ActorDemo123!"><button onclick="login()">Sign in</button><p id="err"></p></div>
<section id="dash" hidden><div id="who"></div><div class="grid"><div class="card"><b>Identity</b><div id="identity" class="metric">—</div></div><div class="card"><b>Productions</b><div id="pc" class="metric">—</div></div><div class="card"><b>Auditions</b><div id="ac" class="metric">—</div></div></div>
<div id="casting" class="card" hidden><h2>Production control</h2><input id="pn" placeholder="Production name"><select id="cls"><option>CONFIDENTIAL</option><option>RESTRICTED</option><option>PUBLIC</option></select><button onclick="prod()">Create</button><hr><input id="pid" placeholder="Production ID"><input id="aid" placeholder="Actor ID"><input id="at" placeholder="Audition title"><button onclick="invite()">Invite actor</button></div>
<div class="card"><h2>Productions</h2><div id="prods"></div></div><div class="card"><h2>Secure auditions</h2><div id="aud"></div></div>
<div class="card"><h2>Likeness Firewall</h2><input id="lpid" placeholder="Production ID"><button onclick="loadPolicy()">Load</button><div id="policy"></div></div>
<div id="auditbox" class="card" hidden><h2>Security audit log</h2><pre id="logs"></pre></div><button onclick="logout()">Log out</button></section>
<script src="app.js"></script></main></body></html>
